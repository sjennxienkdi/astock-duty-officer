default_language_version:
  python: python3.11
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, "langchain-core"]
        args: [--strict]
        exclude: ^(web/tests)/
  - repo: local
    hooks:
      - id: check-secrets
        name: 脱敏终检 (plan §16)
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false
