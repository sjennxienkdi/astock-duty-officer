[project]
name = "duty-agent"
version = "0.1.0"
description = "A股值班台 agent 层：角色、护栏、记忆、通知"
requires-python = "==3.11.*"
dependencies = [
    "duty-engine",
    "langgraph",
    "deepagents",
    "langchain-core",
    "langchain-mcp-adapters",
    "pydantic-settings",
    "requests",
    "rank-bm25",
    "sqlite-vec",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duty_agent"]

[tool.uv.sources]
duty-engine = { workspace = true }
